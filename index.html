<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT - Estudo Ativo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

select, button {
    padding: 8px 12px;
    margin: 5px 5px 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
}

button {
    background-color: #1e3a8a;
    color: white;
    border: none;
}

button:hover {
    background-color: #162e6f;
}

.resposta {
    margin-top: 15px;
    font-weight: bold;
    color: #0d47a1;
}

.bloco-extra {
    margin-top: 15px;
    background: #f0f4ff;
    padding: 10px;
    border-radius: 6px;
}

.hidden {
    display: none;
}

hr {
    margin: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<h1>TRT - Estudo Ativo</h1>

<label>Matéria:</label>
<select id="materiaFiltro"></select>

<label>Assunto:</label>
<select id="assuntoFiltro"></select>

<hr>

<div id="perguntaContainer"></div>

</div>

<script>

const perguntas = [

/* ===================== PODER LEGISLATIVO ===================== */

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `1. É prerrogativa do TCU apreciar as contas prestadas _________ (periodicidade) pelo _________________________ (pessoa), mediante parecer prévio que deverá ser elaborado em _________ (prazo) dias, a contar de seu recebimento.`,
ajuda: "",
resposta: `Resposta: É prerrogativa do TCU apreciar as contas prestadas <b>anualmente</b> pelo <b>Presidente da República</b>, mediante parecer prévio que deverá ser elaborado em <b>sessenta dias</b>, a contar de seu recebimento. <br><br>Base normativa: art. 71, I, da Constituição Federal.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `2. Segundo a jurisprudência do STF:
a) Quais são as 4 medidas que não podem ser determinadas pela CPI por dependerem de reserva de jurisdição?
b) Qual é a 1 medida que pode ser determinada diretamente pela CPI?`,
ajuda: `Quais das opções abaixo podem ser determinadas por uma CPI?<br>
( ) Determinar indisponibilidade de bens.<br>
( ) Quebrar sigilo bancário, fiscal e de dados.<br>
( ) Decretar prisão preventiva.<br>
( ) Realizar busca domiciliar.<br>
( ) Autorizar interceptação telefônica.`,
resposta: `Resposta: A CPI pode determinar <b>quebra de sigilo bancário, fiscal e de dados</b>. <br><br>Não pode determinar: prisão preventiva, busca domiciliar, interceptação telefônica e indisponibilidade de bens. <br><br>Base normativa: art. 58, §3º, CF e jurisprudência do STF.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `3. A autorização de operações externas de natureza financeira é competência de qual órgão?`,
ajuda: `Congresso Nacional<br>Câmara dos Deputados<br>Senado Federal`,
resposta: `Resposta: <b>Congresso Nacional</b>. <br><br>Base normativa: art. 49, I, da Constituição Federal.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `4. Do que se trata a imunidade parlamentar material? É automática ou depende de requisito?`,
ajuda: `civil | penal | opiniões | palavras | votos | existência de nexo`,
resposta: `Resposta: A imunidade parlamentar material consiste na impossibilidade de responsabilização <b>civil ou penal</b> dos parlamentares por suas <b>opiniões, palavras e votos</b>. Depende da <b>existência de nexo funcional</b> com o mandato. <br><br>Base normativa: art. 53, caput, CF e jurisprudência do STF.`,
extra: `<b>Quadro comparativo:</b><br>
Material → protege conteúdo (opiniões, palavras e votos).<br>
Formal → protege processo (prisão e processo).`
},

/* ===================== DIREITOS FUNDAMENTAIS ===================== */

{
materia: "Constitucional",
assunto: "Direitos Fundamentais",
pergunta: `1. O art. 5º, XIII, da CF possui norma de eficácia ________.`,
ajuda: `ilimitada | programática | eficácia limitada | eficácia plena | eficácia contida`,
resposta: `Resposta: <b>Eficácia contida</b>. <br><br>Base normativa: art. 5º, XIII, da Constituição Federal.`,
extra: `<b>Explicação:</b><br>
Plena → aplicabilidade imediata e integral.<br>
Contida → aplicabilidade imediata, podendo ser restringida por lei.<br>
Limitada → depende de regulamentação.<br>
Programática → estabelece diretrizes.`
},

/* ===================== NACIONALIDADE ===================== */

{
materia: "Constitucional",
assunto: "Nacionalidade",
pergunta: `1. Sobre a extradição:
a) Em quais condições o brasileiro pode ser extraditado?
b) E o estrangeiro?`,
ajuda: `Regra geral: nenhum brasileiro será extraditado.<br>
Exceções: naturalizado – crime comum antes da naturalização – tráfico ilícito.<br>
Estrangeiro: crime político ou de opinião.`,
resposta: `Resposta: Regra geral: nenhum brasileiro será extraditado. <br>
Exceção: admite-se extradição de <b>naturalizado</b> por crime comum praticado antes da naturalização ou por tráfico ilícito de entorpecentes. <br>
Estrangeiro: não será concedida extradição por crime político ou de opinião. <br><br>
Base normativa: art. 5º, LI e LII, CF.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Nacionalidade",
pergunta: `2. Quais são os 7 cargos privativos de brasileiros natos?`,
ajuda: `Presidência – Defesa – Forças Armadas – Judiciário – Legislativo – Segurança institucional`,
resposta: `Resposta: Presidente e Vice-Presidente da República; Presidentes da Câmara e do Senado; Ministro do STF; Carreira diplomática; Oficial das Forças Armadas; Ministro da Defesa. <br><br>Base normativa: art. 12, §3º, CF.`,
extra: ""
},

/* ===================== DIREITO ADMINISTRATIVO ===================== */

{
materia: "Direito Administrativo",
assunto: "Ato Administrativo",
pergunta: `1. Quais são os 5 elementos do ato administrativo? Quais admitem convalidação?`,
ajuda: `quem pratica | finalidade | forma | motivo | conteúdo`,
resposta: `Resposta: Elementos: <b>Competência, Finalidade, Forma, Motivo e Objeto</b>. <br>
Admite-se convalidação em vício de <b>competência (não exclusiva)</b> e <b>forma (não essencial)</b>. <br><br>
Base normativa: art. 55 da Lei 9.784/99 e doutrina majoritária.`,
extra: `<b>Mnemônico:</b> FOCO NA CONVALIDAÇÃO = Competência e Forma`
}

];

let indiceAtual = 0;
let perguntasFiltradas = [];

const materiaSelect = document.getElementById("materiaFiltro");
const assuntoSelect = document.getElementById("assuntoFiltro");
const container = document.getElementById("perguntaContainer");

function carregarFiltros() {
    const materias = [...new Set(perguntas.map(p => p.materia))];
    materiaSelect.innerHTML = materias.map(m => `<option>${m}</option>`).join("");
    atualizarAssuntos();
}

function atualizarAssuntos() {
    const assuntos = [...new Set(perguntas
        .filter(p => p.materia === materiaSelect.value)
        .map(p => p.assunto))];
    assuntoSelect.innerHTML = assuntos.map(a => `<option>${a}</option>`).join("");
    filtrarPerguntas();
}

function filtrarPerguntas() {
    perguntasFiltradas = perguntas.filter(p =>
        p.materia === materiaSelect.value &&
        p.assunto === assuntoSelect.value
    );
    indiceAtual = 0;
    mostrarPergunta();
}

function mostrarPergunta() {
    if (perguntasFiltradas.length === 0) {
        container.innerHTML = "Sem perguntas.";
        return;
    }

    const p = perguntasFiltradas[indiceAtual];

    container.innerHTML = `
        <p>${p.pergunta}</p>

        <button onclick="mostrarAjuda()">Ajuda</button>
        <button onclick="mostrarResposta()">Mostrar Resposta</button>
        <button onclick="proximaPergunta()">Próxima Pergunta</button>

        <div id="ajuda" class="bloco-extra hidden">${p.ajuda}</div>
        <div id="resposta" class="resposta hidden">${p.resposta}</div>
        <div id="extra" class="bloco-extra hidden">${p.extra}</div>

        <div id="avaliacao" class="hidden">
            <button>Acertei</button>
            <button>Errei</button>
        </div>
    `;
}

function mostrarAjuda() {
    document.getElementById("ajuda").classList.remove("hidden");
}

function mostrarResposta() {
    document.getElementById("resposta").classList.remove("hidden");
    document.getElementById("avaliacao").classList.remove("hidden");
    document.getElementById("extra").classList.remove("hidden");
}

function proximaPergunta() {
    indiceAtual++;
    if (indiceAtual >= perguntasFiltradas.length) indiceAtual = 0;
    mostrarPergunta();
}

materiaSelect.addEventListener("change", atualizarAssuntos);
assuntoSelect.addEventListener("change", filtrarPerguntas);

carregarFiltros();

</script>

</body>
</html>
