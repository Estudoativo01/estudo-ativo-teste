<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRT - Estudo Ativo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

select, button {
    padding: 8px 12px;
    margin: 5px 5px 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    cursor: pointer;
}

button {
    background-color: #1e3a8a;
    color: white;
    border: none;
}

button:hover {
    background-color: #162e6f;
}

.resposta {
    margin-top: 15px;
    font-weight: bold;
    color: #0d47a1;
}

.bloco-extra {
    margin-top: 15px;
    background: #eef2ff;
    padding: 12px;
    border-radius: 6px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>
<div class="container">

<h1>TRT - Estudo Ativo</h1>

<label>Matéria:</label>
<select id="materiaFiltro"></select>

<label>Assunto:</label>
<select id="assuntoFiltro"></select>

<hr>

<div id="perguntaContainer"></div>

</div>

<script>

const perguntas = [

/* ================= CONSTITUCIONAL - PODER LEGISLATIVO ================= */

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `1. É prerrogativa do TCU apreciar as contas prestadas _________ pelo _________________________, mediante parecer prévio elaborado em _________ dias.`,
ajuda: `🔎 Dica:<br><br>
• O TCU apenas emite parecer prévio — quem julga é o Congresso.<br>
• A prestação de contas presidencial é periódica.<br>
• O prazo está expressamente previsto na Constituição.<br><br>
Pergunte-se: qual é a periodicidade e qual o prazo constitucional?`,
resposta: `Resposta: É prerrogativa do TCU apreciar as contas prestadas <b>anualmente</b> pelo <b>Presidente da República</b>, mediante parecer prévio elaborado em <b>sessenta dias</b>.<br><br>
Base normativa: art. 71, I, da Constituição Federal de 1988.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `2. Segundo o STF:
a) Quais medidas a CPI não pode determinar por dependerem de reserva de jurisdição?
b) Qual medida pode determinar diretamente?`,
ajuda: `🔎 Dica estratégica:<br><br>
A CPI possui poderes investigatórios, mas não exerce jurisdição.<br>
Pergunte-se: quais medidas restringem direitos fundamentais e exigem decisão judicial?<br>
E qual medida o STF admite que seja determinada diretamente pela CPI?`,
resposta: `Resposta: A CPI <b>não pode</b> determinar prisão preventiva, busca domiciliar, interceptação telefônica e indisponibilidade de bens.<br><br>
Pode determinar diretamente a <b>quebra de sigilo bancário, fiscal e de dados</b>.<br><br>
Base normativa: art. 58, §3º, da CF/88 e jurisprudência consolidada do STF.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `3. A autorização de operações externas de natureza financeira é competência de qual órgão?`,
ajuda: `🔎 Dica:<br><br>
A Constituição atribui essa competência ao órgão que representa o Poder Legislativo em sua totalidade, e não apenas uma das Casas.`,
resposta: `Resposta: <b>Congresso Nacional</b>.<br><br>
Compete ao Congresso Nacional autorizar operações externas de natureza financeira de interesse da União, Estados, DF e Municípios.<br><br>
Base normativa: art. 49, I, da Constituição Federal de 1988.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Poder Legislativo",
pergunta: `4. Do que se trata a imunidade parlamentar material? É automática?`,
ajuda: `🔎 Dica:<br><br>
Protege o conteúdo das manifestações parlamentares.<br>
Pergunte-se: protege contra responsabilidade civil? Penal? Ambas?<br>
É necessário vínculo com o exercício do mandato?`,
resposta: `Resposta: A imunidade parlamentar material consiste na impossibilidade de responsabilização <b>civil ou penal</b> do parlamentar por suas <b>opiniões, palavras e votos</b>.<br><br>
Sua incidência depende da existência de <b>nexo funcional</b> com o exercício do mandato.<br><br>
Base normativa: art. 53, caput, da CF/88 e jurisprudência do STF.`,
extra: `<b>Quadro comparativo:</b><br>
Material → protege o conteúdo das manifestações.<br>
Formal → protege contra prisão e processo.`
},

/* ================= DIREITOS FUNDAMENTAIS ================= */

{
materia: "Constitucional",
assunto: "Direitos Fundamentais",
pergunta: `1. O art. 5º, XIII, da CF possui norma de eficácia ________.`,
ajuda: `🔎 Dica:<br><br>
A norma garante liberdade profissional, mas permite que a lei estabeleça qualificações.<br>
Pergunte-se: é autoaplicável? Pode sofrer restrição posterior?`,
resposta: `Resposta: <b>Eficácia contida</b>.<br><br>
Possui aplicabilidade imediata, mas admite restrição posterior por lei.<br><br>
Base normativa: art. 5º, XIII, da Constituição Federal de 1988.`,
extra: `<b>Explicação:</b><br>
Plena → aplicação imediata e integral.<br>
Contida → aplicação imediata, mas restringível.<br>
Limitada → depende de regulamentação.<br>
Programática → estabelece diretrizes.`
},

/* ================= NACIONALIDADE ================= */

{
materia: "Constitucional",
assunto: "Nacionalidade",
pergunta: `1. Sobre a extradição:
a) Em quais condições o brasileiro pode ser extraditado?
b) E o estrangeiro?`,
ajuda: `🔎 Dica estruturada:<br><br>
• Regra geral: brasileiro não é extraditado.<br>
• Exceção: apenas naturalizado.<br>
• Analise momento e tipo do crime.<br>
• Estrangeiro: pense em crime político e de opinião.`,
resposta: `Resposta:<br>
Regra geral: nenhum brasileiro será extraditado.<br><br>
Exceção: admite-se extradição de <b>naturalizado</b> por crime comum praticado <b>antes da naturalização</b> ou por comprovado envolvimento em <b>tráfico ilícito de entorpecentes e drogas afins</b>.<br><br>
Não será concedida extradição de estrangeiro por crime político ou de opinião.<br><br>
Base normativa: art. 5º, LI e LII, da CF/88.`,
extra: ""
},

{
materia: "Constitucional",
assunto: "Nacionalidade",
pergunta: `2. Quais são os 7 cargos privativos de brasileiros natos?`,
ajuda: `🔎 Dica:<br>
Presidência – Defesa – Forças Armadas – STF – Casas Legislativas – Segurança institucional.`,
resposta: `Resposta:<br>
• Presidente e Vice-Presidente da República;<br>
• Presidente da Câmara dos Deputados;<br>
• Presidente do Senado Federal;<br>
• Ministro do Supremo Tribunal Federal;<br>
• Carreira diplomática;<br>
• Oficial das Forças Armadas;<br>
• Ministro de Estado da Defesa.<br><br>
Base normativa: art. 12, §3º, da Constituição Federal de 1988.`,
extra: ""
},

/* ================= DIREITO ADMINISTRATIVO ================= */

{
materia: "Direito Administrativo",
assunto: "Ato Administrativo",
pergunta: `1. Quais são os 5 elementos do ato administrativo? Quais admitem convalidação?`,
ajuda: `🔎 Dica conceitual:<br><br>
Os elementos envolvem sujeito, finalidade pública, forma, motivo e conteúdo.<br>
Convalidação só é possível quando o vício não compromete a essência do ato nem gera prejuízo ao interesse público.`,
resposta: `Resposta:<br>
Elementos do ato administrativo:<br>
• Competência<br>
• Finalidade<br>
• Forma<br>
• Motivo<br>
• Objeto<br><br>
Admite-se convalidação quando o vício recair sobre:<br>
<b>Competência</b> (desde que não seja exclusiva)<br>
<b>Forma</b> (desde que não seja essencial)<br><br>
Base normativa: art. 55 da Lei 9.784/1999 e doutrina majoritária.`,
extra: `<b>Mnemônico:</b> FOCO NA CONVALIDAÇÃO = Competência e Forma.`
}

];

let indiceAtual = 0;
let perguntasFiltradas = [];

const materiaSelect = document.getElementById("materiaFiltro");
const assuntoSelect = document.getElementById("assuntoFiltro");
const container = document.getElementById("perguntaContainer");

function carregarFiltros() {
    const materias = [...new Set(perguntas.map(p => p.materia))];
    materiaSelect.innerHTML = materias.map(m => `<option>${m}</option>`).join("");
    atualizarAssuntos();
}

function atualizarAssuntos() {
    const assuntos = [...new Set(perguntas
        .filter(p => p.materia === materiaSelect.value)
        .map(p => p.assunto))];
    assuntoSelect.innerHTML = assuntos.map(a => `<option>${a}</option>`).join("");
    filtrarPerguntas();
}

function filtrarPerguntas() {
    perguntasFiltradas = perguntas.filter(p =>
        p.materia === materiaSelect.value &&
        p.assunto === assuntoSelect.value
    );
    indiceAtual = 0;
    mostrarPergunta();
}

function mostrarPergunta() {
    if (perguntasFiltradas.length === 0) {
        container.innerHTML = "Sem perguntas.";
        return;
    }

    const p = perguntasFiltradas[indiceAtual];

    container.innerHTML = `
        <p>${p.pergunta}</p>

        <button onclick="mostrarAjuda()">Ajuda</button>
        <button onclick="mostrarResposta()">Mostrar Resposta</button>
        <button onclick="proximaPergunta()">Próxima Pergunta</button>

        <div id="ajuda" class="bloco-extra hidden">${p.ajuda}</div>
        <div id="resposta" class="resposta hidden">${p.resposta}</div>
        <div id="extra" class="bloco-extra hidden">${p.extra}</div>

        <div id="avaliacao" class="hidden">
            <button>Acertei</button>
            <button>Errei</button>
        </div>
    `;
}

function mostrarAjuda() {
    document.getElementById("ajuda").classList.remove("hidden");
}

function mostrarResposta() {
    document.getElementById("resposta").classList.remove("hidden");
    document.getElementById("avaliacao").classList.remove("hidden");
    document.getElementById("extra").classList.remove("hidden");
}

function proximaPergunta() {
    indiceAtual++;
    if (indiceAtual >= perguntasFiltradas.length) indiceAtual = 0;
    mostrarPergunta();
}

materiaSelect.addEventListener("change", atualizarAssuntos);
assuntoSelect.addEventListener("change", filtrarPerguntas);

carregarFiltros();

</script>

</body>
</html>
